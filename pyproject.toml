[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visualcommand"
dynamic = ["version"]
description = "Local webcam hand-gesture shortcuts for Windows, living in the system tray."
requires-python = ">=3.10,<3.13"
dependencies = [
    "mediapipe>=0.10.14",
    "opencv-contrib-python>=4.9",  # same build MediaPipe pulls in; don't add opencv-python next to it
    "numpy",
    "pystray>=0.19",
    "Pillow>=10",
    "mss>=9",
    "pycaw>=20240210",
    "comtypes>=1.2",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.6"]

[project.gui-scripts]
visualcommand = "visualcommand.main:main"

[tool.setuptools.dynamic]
version = { attr = "visualcommand.__version__" }

[tool.setuptools.packages.find]
include = ["visualcommand*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
